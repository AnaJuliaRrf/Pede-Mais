<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Cadastro</title>

  <link rel="stylesheet" href="./css/cadastro.css">

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="register-container">

    <!-- Fundo azul -->
    <section class="left-background"></section>

    <!-- Formulário -->
    <section class="form-section">

      <div class="form-wrapper">

        <div class="header">
          <h1>Seja bem-vindo!</h1>

          <p>
            Vamos começar coletando seus dados pessoais
            e depois os da empresa, ok?
          </p>
        </div>

        <form>

          <!-- COLUNA ESQUERDA -->
          <div class="column">

            <h2>Dados pessoais</h2>

            <div class="input-group full">
              <label>Seu nome</label>
              <input type="text">
            </div>

            <div class="input-group full">
              <label>CPF</label>
              <input type="text">
            </div>

            <div class="row">
              <div class="input-group">
                <label>Nascimento</label>
                <input type="date">
              </div>

              <div class="input-group">
                <label>Telefone</label>
                <input type="text">
              </div>
            </div>

            <div class="row">
              <div class="input-group">
                <label>Endereço</label>
                <input type="text">
              </div>

              <div class="input-group small">
                <label>CEP</label>
                <input type="text">
              </div>
            </div>

            <div class="input-group full">
              <label>Email</label>
              <input type="email">
            </div>

          </div>

          <!-- COLUNA DIREITA -->
          <div class="column">

            <h2>Dados empresa</h2>

            <div class="input-group full">
              <label>Nome da empresa</label>
              <input type="text">
            </div>

            <div class="row">

              <div class="input-group">
                <label>Cidade</label>
                <input type="text">
              </div>

              <div class="input-group">
                <label>Endereço</label>
                <input type="text">
              </div>

              <div class="input-group tiny">
                <label>N°</label>
                <input type="text">
              </div>

            </div>

            <div class="row">

              <div class="input-group">
                <label>CNPJ / CPF</label>
                <input type="text">
              </div>

              <div class="input-group small">
                <label>CEP</label>
                <input type="text">
              </div>

            </div>

            <div class="row">

              <div class="input-group">
                <label>Foco</label>
                <input type="text">
              </div>

              <div class="input-group">
                <label>Telefone comercial</label>
                <input type="text">
              </div>

            </div>

            <div class="input-group full">
              <label>Email comercial</label>
              <input type="email">
            </div>

            <div class="bottom-row">

              <div class="input-group password-field">
                <label>Crie uma senha</label>
                <input type="password">
              </div>

              <button type="submit">
                Cadastrar
              </button>

            </div>

          </div>

        </form>

      </div>

    </section>

  </main>

</body>
</html>
